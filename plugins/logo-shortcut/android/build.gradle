apply plugin: 'com.android.library'

android {
    namespace "com.integratedresults.logoshortcut"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        minSdk project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
        targetSdk project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':capacitor-android')
    // capacitor-android declares androidx.core as `implementation`, so it is
    // not visible on this module's compile classpath; declare it explicitly.
    // Version matches Capacitor 6's androidxCoreVersion (1.12.0).
    implementation "androidx.core:core:1.12.0"
}
